# Versões fixas, para o projeto continuar reproduzível. A imagem memgraph/memgraph
# basta: o projeto não usa os algoritmos do MAGE.
services:
  memgraph:
    image: memgraph/memgraph:3.14.0
    container_name: memgraph
    ports:
      - "7687:7687"
      - "7444:7444"
    volumes:
      - mg_lib:/var/lib/memgraph
  lab:
    image: memgraph/lab:3.14.2
    container_name: memgraph-lab
    ports:
      - "3000:3000"
    depends_on:
      - memgraph
    environment:
      - QUICK_CONNECT_MG_HOST=memgraph
      - QUICK_CONNECT_MG_PORT=7687
volumes:
  mg_lib:
